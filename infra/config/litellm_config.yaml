# 어떤 모델을 쓸지는 여기서 정한다. 엔드포인트 주소와 키는 .env로 주입한다.
# model_name은 대외 이름(별칭)이라 실제 모델과 달라도 된다 — BFF가 .env의 LLM_MODEL로 이 이름을 부른다.
model_list:
  - model_name: default
    litellm_params:
      # 실제로 호출할 모델. 이 줄을 쓰는 모델에 맞게 바꾼다(.env의 LLM_API_BASE와 짝이다).
      #   OpenAI → openai/gpt-4o-mini          Gemini → openai/gemini-2.5-flash
      #   Ollama → openai/gemma3:4b            Claude → anthropic/claude-opus-5
      # Claude는 OpenAI 호환 주소가 없다 — 이때는 아래 api_base 줄을 지운다.
      model: openai/gpt-4o-mini
      api_base: os.environ/LLM_API_BASE
      api_key: os.environ/LLM_API_KEY
    model_info:
      description: "LLM_API_BASE가 가리키는 엔드포인트의 모델"
      max_tokens: 131072

router_settings:
  routing_strategy: simple-shuffle
  redis_host: redis
  redis_port: 6379
  num_retries: 3
  timeout: 300

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY